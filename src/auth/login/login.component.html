<div
  class="d-flex align-items-center justify-content-center min-vh-100 bg-light"
>
  <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-primary">Welcome Back</h3>
      <p class="text-muted">Please login to your account</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="Enter your email"
        />
        <div
          class="text-danger small"
          *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')"
        >
          Email is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="Enter your password"
        />
        <div
          class="text-danger small"
          *ngIf="
            form.get('password')?.touched &&
            form.get('password')?.hasError('required')
          "
        >
          Password is required
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="remember" />
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <a href="#" class="text-decoration-none small">Forgot Password?</a>
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100 py-2"
        [disabled]="form.invalid"
      >
        Login
      </button>
    </form>

    <div class="text-center mt-4 small">
      Don't have an account?
      <a href="#" class="text-primary text-decoration-none fw-semibold"
        >Sign up</a
      >
    </div>
  </div>
</div>
