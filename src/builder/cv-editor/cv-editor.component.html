<div class="bg-main p-5 justify-content-center w-100" (click)="hideMenu()">
  <div class="template mx-auto bg-main">
    <div class="edit-nav bg-white rounded-3 p-2">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex bg-white">
          <i class="bi bi-arrow-clockwise fs-4"></i>
          <i class="bi bi-arrow-counterclockwise fs-4"></i>
        </div>

        <div class="d-flex">
          <i class="bi bi-type-bold fs-4"></i>
          <i class="bi bi-link-45deg px-2 fs-4"></i>
          <i class="bi bi-type-italic fs-4 pe-2"></i>
          <i class="bi bi-type-underline fs-4"></i>
        </div>
        <div class="d-flex gap-3 small" *ngIf="selectedSection">
          <div
            class="form-check form-check-square"
            *ngFor="let item of selectedSection | keyvalue"
          >
            <input
              class="form-check-input"
              type="checkbox"
              id="check1"
              [(ngModel)]="selectedSection[item.key]"
            />
            <label class="form-check-label text-muted" for="check1">
              {{ item.key }}
            </label>
          </div>
        </div>
        <div class="d-flex download-btn">
          <button class="btn btn-outline-main btn-sm" (click)="generatePDF()">
            <i class="bi bi-arrow-down-circle fs-5"></i>
            <span class="px-1 m-auto"> download </span>
          </button>
        </div>
      </div>
    </div>
    <div class="bg-white mt-4" id="templateEditor">
      <app-section-edit-menu></app-section-edit-menu>

      <div class="p-3">
        <!--Intro-->
        <app-intro
          [data]="data.intro"
          [dataConfig]="dataConfig.intro"
          (click)="selectedSection = dataConfig.intro"
        ></app-intro>

        <!--contact info-->
        <app-contact-info
          [data]="data.contactInfo"
          (click)="selectedSection = dataConfig.contactInfo"
        >
