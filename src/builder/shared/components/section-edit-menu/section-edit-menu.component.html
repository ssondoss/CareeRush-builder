<ng-container>
  <div
    class="section-menu border rounded d-flex bg-white px-3"
    [class.show]="show"
    [ngStyle]="{
      top: top + 'px',
      left: left + 'px',
    }"
  >
    <div class="menu-item d-flex" (click)="delete()">
      <i class="bi bi-trash-fill text-danger fs-6 m-auto"></i>
    </div>
    <div class="d-flex menu-item px-3 " (click)="add()">
      <i class="bi bi-plus-circle-fill m-auto text-success fs-6"></i>
    </div>
    <!-- <div class="menu-item d-flex">
      <i class="bi bi-gear-fill text-secondary fs-6 m-auto"></i>
    </div> -->

    <!-- <div class="menu-item d-flex">
      <i class="bi bi-cloud-plus-fill fs-5 m-auto"></i>
    </div> -->
    <div class="menu-item d-flex pe-1" (click)="moveRight()">
      <i class="bi bi-arrow-right-circle fs-6 m-auto"></i>
    </div>
    <div class="menu-item d-flex">
      <i class="bi bi-arrow-left-circle fs-6 m-auto" (click)="moveLeft()"></i>
    </div>
  </div>
</ng-container>
