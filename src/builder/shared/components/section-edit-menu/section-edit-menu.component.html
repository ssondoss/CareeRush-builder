<ng-container>
  <div
    class="section-menu border rounded "
    [class.show]="show"
    [ngStyle]="{
      top: top + 'px',
      left: left + 'px',
    }"
  >
    <div class="menu-item d-flex"><i class="bi bi-trash-fill  text-danger fs-6  m-auto"></i>  </div>
    <!-- <div class=" menu-item"><i class="bi bi-plus-circle-fill  text-success  fs-6 "></i></div> -->
    <div class="menu-item d-flex"><i class="bi bi-gear-fill  text-secondary fs-6  m-auto"></i>  </div>

    <div class="menu-item d-flex"><i class="bi bi-cloud-plus-fill fs-5 m-auto"></i> </div>
  </div>
</ng-container>
