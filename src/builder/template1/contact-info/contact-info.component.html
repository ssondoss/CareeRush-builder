

<div class="p-2" >
  <div class="row">
    <div
      #container1
      class="col-6 mt-2 contact"
      (click)="showMenu($event,container1,i) "
      *ngFor="let item of data.items; let i = index"
    >
      <div class="d-flex">
        <div class="dropdown">
          <div
            class="dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i [class]="item.icon"></i>
          </div>

          <ul
            class="dropdown-menu p-2"
            style="max-height: 200px; overflow-y: auto; min-width: 30px"
          >
            <li
              *ngFor="let icon of icons"
              (click)="selectIcon(icon, i)"
              class="dropdown-item d-flex align-items-center"
            >
              <i [class]="icon" style="font-size: 1rem; margin-right: 8px"></i>
            </li>
          </ul>
        </div>
        <div class="d-flex flex-fill">
          <i class="bi bi-exclamation-lg text-danger" *ngIf="!item.text"></i>
          <input
            type="text"
            name="title"
            [(ngModel)]="item.text"
            spellcheck="false"
            placeholder="Contact Info"
          />
        </div>
      </div>
    </div>

  
  </div>
</div>

<div class="p-2 d-none">
  <div class="row">
    <div class="col-6 mt-2" *ngFor="let item of data.items; let i = index">
      <div class="d-flex">
        <i [class]="item.icon" class="pe-1 my-auto"></i>
        <span>
          {{ item.text }}
        </span>
      </div>
    </div>
  </div>
</div>
